<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
</helmet>
<div class="svc-related">
  <a href="{{ href }}" class="svc-tile">
    <img src="{{ photo }}" alt="" loading="lazy" />
    <div class="svc-tile-scrim"></div>
    <div class="svc-tile-arrow"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></div>
    <div class="svc-tile-label">{{ title }}</div>
  </a>
  <p class="svc-meta-blurb">{{ blurb }}</p>
  <div class="svc-meta-actions">
    <a href="{{ href }}" class="about-link">Подробнее</a>
    <dc-import name="LeadModal" service="{{ title }}" label="Заявка" variant="outline-dark" size="md" hint-size="104px,44px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 320, &quot;height&quot;: 340}, &quot;title&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Услуга&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;blurb&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Краткое описание услуги&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;href&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;#&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;icon&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;boundary&quot;, &quot;options&quot;: [&quot;boundary&quot;, &quot;blueprint&quot;, &quot;check-doc&quot;, &quot;target&quot;, &quot;split&quot;, &quot;house&quot;, &quot;passport&quot;, &quot;building&quot;, &quot;shield&quot;], &quot;tsType&quot;: &quot;string&quot;}}">
const ICON_PHOTO = {
  boundary: 'assets/photos/hero-mezhevanie-v2.webp',
  blueprint: 'assets/drawings/tehplan.svg',
  split: 'assets/drawings/razdel.svg',
};

class Component extends DCLogic {
  renderVals() {
    const icon = this.props.icon || '';
    return {
      title: this.props.title || '',
      blurb: this.props.blurb || '',
      href: this.props.href || '#',
      photo: ICON_PHOTO[icon] || 'assets/photos/hero-home-v3.webp',
    };
  }
}
</script>
</body>
</html>
