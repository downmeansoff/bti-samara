<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="assets/fonts/fonts.css" rel="stylesheet">
</helmet>
<div style="background:#ffffff;border:1px solid #ececE4;border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:16px;height:100%;box-sizing:border-box;transition:transform 0.18s ease,box-shadow 0.18s ease,border-color 0.18s ease" style-hover="transform:translateY(-4px);box-shadow:0 22px 44px rgba(10,20,40,0.09);border-color:#d8e8db">
  <a href="{{ href }}" style="text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:14px;flex:1 1 auto">
    <div style="width:52px;height:52px;border-radius:14px;background:#eaf7ee;display:flex;align-items:center;justify-content:center;color:#1f9d4c;flex:0 0 auto">
      <sc-if value="{{ isBoundary }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="7" width="15" height="11" rx="1"></rect><circle cx="4.5" cy="7" r="1.4" fill="currentColor" stroke="none"></circle><circle cx="19.5" cy="7" r="1.4" fill="currentColor" stroke="none"></circle><circle cx="4.5" cy="18" r="1.4" fill="currentColor" stroke="none"></circle><circle cx="19.5" cy="18" r="1.4" fill="currentColor" stroke="none"></circle></svg></sc-if>
      <sc-if value="{{ isBlueprint }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="16" rx="1.5"></rect><path d="M3.5 12h10M13.5 4v8M13.5 16v4"></path></svg></sc-if>
      <sc-if value="{{ isCheckDoc }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"></path><path d="M14 3v4h4"></path><path d="m9 13.2 2.1 2.1L15.5 11"></path></svg></sc-if>
      <sc-if value="{{ isTarget }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7"></circle><circle cx="12" cy="12" r="2.4"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"></path></svg></sc-if>
      <sc-if value="{{ isSplit }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="13.5" width="7.2" height="7.2" rx="1.2"></rect><rect x="13.8" y="13.5" width="7.2" height="7.2" rx="1.2"></rect><path d="M12 3v7M8.5 6.5 12 3l3.5 3.5"></path></svg></sc-if>
      <sc-if value="{{ isHouse }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7"></path><path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"></path><path d="M10 20v-5.5h4V20"></path></svg></sc-if>
      <sc-if value="{{ isPassport }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"></rect><circle cx="12" cy="9.3" r="2.3"></circle><path d="M8.3 16c.7-2 2-3 3.7-3s3 1 3.7 3"></path></svg></sc-if>
      <sc-if value="{{ isBuilding }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4" width="9" height="16" rx="1"></rect><path d="M13.5 9h6v11h-6"></path><path d="M7.5 8h.01M11 8h.01M7.5 11.5h.01M11 11.5h.01M7.5 15h.01M11 15h.01"></path></svg></sc-if>
      <sc-if value="{{ isShield }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2 5.5 6v6c0 4.4 2.9 7.5 6.5 8.8 3.6-1.3 6.5-4.4 6.5-8.8V6L12 3.2Z"></path><path d="m9 12.2 2.1 2.1L15.5 10"></path></svg></sc-if>
    </div>
    <div style="font-family:'Unbounded',sans-serif;font-size:16.5px;font-weight:700;color:#0e1e35;line-height:1.3">{{ title }}</div>
    <div style="font-size:14px;color:#5c6670;line-height:1.55;flex:1 1 auto">{{ blurb }}</div>
  </a>
  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:14px;border-top:1px solid #f1f2ee">
    <a href="{{ href }}" style="color:#1f9d4c;text-decoration:none;font-size:14px;font-weight:700;display:flex;align-items:center;gap:5px">
      Подробнее
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </a>
    <dc-import name="LeadModal" service="{{ title }}" label="Заявка" variant="outline-dark" size="md" hint-size="104px,40px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 320, &quot;height&quot;: 340}, &quot;title&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Услуга&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;blurb&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Краткое описание услуги&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;href&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;#&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;icon&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;boundary&quot;, &quot;options&quot;: [&quot;boundary&quot;, &quot;blueprint&quot;, &quot;check-doc&quot;, &quot;target&quot;, &quot;split&quot;, &quot;house&quot;, &quot;passport&quot;, &quot;building&quot;, &quot;shield&quot;], &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const icon = this.props.icon || '';
    return {
      title: this.props.title || '',
      blurb: this.props.blurb || '',
      href: this.props.href || '#',
      isBoundary: icon === 'boundary',
      isBlueprint: icon === 'blueprint',
      isCheckDoc: icon === 'check-doc',
      isTarget: icon === 'target',
      isSplit: icon === 'split',
      isHouse: icon === 'house',
      isPassport: icon === 'passport',
      isBuilding: icon === 'building',
      isShield: icon === 'shield',
    };
  }
}
</script>
</body>
</html>
