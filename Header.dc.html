<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="true">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@keyframes menuPanelIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
</style>
</helmet>
<div style="position:sticky;top:0;z-index:500;background:rgba(250,250,247,0.9);backdrop-filter:blur(10px);border-bottom:1px solid #e9ebe4">
  <div style="max-width:1240px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-sizing:border-box">
    <a href="index.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;flex:0 0 auto">
      <img src="assets/logo-mark.png" alt="Кадастровый инженер" style="width:42px;height:42px;object-fit:contain;flex:0 0 auto" />
      <div style="display:flex;flex-direction:column;line-height:1.08">
        <span style="font-family:'Unbounded',sans-serif;font-size:13px;font-weight:700;color:#0e1e35;letter-spacing:0.01em">КАДАСТРОВЫЙ</span>
        <span style="font-family:'Unbounded',sans-serif;font-size:13px;font-weight:700;color:#1f9d4c;letter-spacing:0.01em">ИНЖЕНЕР</span>
      </div>
    </a>

    <div style="position:relative">
      <button type="button" onClick="{{ toggleMenu }}" style="display:flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;border:1.5px solid #dfe2da;background:#ffffff;color:#0e1e35;font-family:'Manrope',sans-serif;font-weight:700;font-size:14px;cursor:pointer;box-sizing:border-box">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
        Меню
      </button>

      <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
        <div onClick="{{ closeMenu }}" style="position:fixed;inset:0;z-index:590"></div>
        <div style="position:absolute;top:calc(100% + 10px);left:0;width:min(600px,88vw);background:#ffffff;border-radius:18px;box-shadow:0 26px 64px rgba(10,20,40,0.2);border:1px solid #edefe9;padding:22px;animation:menuPanelIn 0.15s ease;z-index:600;box-sizing:border-box">
          <div style="font-size:11px;font-weight:800;color:#9aa0a6;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:10px">Услуги</div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:2px 14px;margin-bottom:14px">
            <sc-for list="{{ services }}" as="s" hint-placeholder-count="9">
              <a href="{{ s.slug }}.dc.html" style="display:block;padding:9px 8px;border-radius:9px;color:#1c2b40;text-decoration:none;font-size:14.5px;font-weight:600;font-family:'Manrope',sans-serif" style-hover="background:#f4f6f1;color:#1f9d4c">{{ s.title }}</a>
            </sc-for>
          </div>
          <div style="height:1px;background:#edefe9;margin:14px 0"></div>
          <div style="display:flex;flex-wrap:wrap;gap:8px 20px;margin-bottom:14px">
            <a href="index.dc.html#about" onClick="{{ closeMenu }}" style="color:#0e1e35;text-decoration:none;font-size:14.5px;font-weight:700;font-family:'Manrope',sans-serif">О компании</a>
            <a href="index.dc.html#awards" onClick="{{ closeMenu }}" style="color:#0e1e35;text-decoration:none;font-size:14.5px;font-weight:700;font-family:'Manrope',sans-serif">Документы и награды</a>
            <a href="index.dc.html#process" onClick="{{ closeMenu }}" style="color:#0e1e35;text-decoration:none;font-size:14.5px;font-weight:700;font-family:'Manrope',sans-serif">Как работаем</a>
            <a href="index.dc.html#reviews" onClick="{{ closeMenu }}" style="color:#0e1e35;text-decoration:none;font-size:14.5px;font-weight:700;font-family:'Manrope',sans-serif">Отзывы</a>
            <a href="index.dc.html#faq" onClick="{{ closeMenu }}" style="color:#0e1e35;text-decoration:none;font-size:14.5px;font-weight:700;font-family:'Manrope',sans-serif">Вопросы</a>
            <a href="index.dc.html#contacts" onClick="{{ closeMenu }}" style="color:#0e1e35;text-decoration:none;font-size:14.5px;font-weight:700;font-family:'Manrope',sans-serif">Контакты</a>
          </div>
          <div style="height:1px;background:#edefe9;margin:14px 0"></div>
          <div style="display:flex;flex-wrap:wrap;gap:10px">
            <a href="tel:+79177696119" style="display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:#0e1e35;text-decoration:none;background:#f6f7f4;padding:9px 13px;border-radius:10px">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.3 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.9 21 3 13.1 3 3.6c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.3 1.1L6.6 10.8Z"></path></svg>
              8 917 769-61-19
            </a>
            <a href="https://t.me/bti_samara63" target="_blank" rel="noreferrer" style="display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:#0e1e35;text-decoration:none;background:#f6f7f4;padding:9px 13px;border-radius:10px">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 3 10.5l6.2 2.3M21 3l-3.4 17-6.2-4.9M21 3 9.9 13.9m0 0-.7 5.6 3.3-3.4"></path></svg>
              Telegram
            </a>
            <a href="mailto:info@bti-samara.ru" style="display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:#0e1e35;text-decoration:none;background:#f6f7f4;padding:9px 13px;border-radius:10px">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>
              Email
            </a>
          </div>
        </div>
      </sc-if>
    </div>

    <div style="flex:1 1 auto"></div>

    <a href="tel:+79177696119" style="display:flex;align-items:center;gap:7px;color:#0e1e35;text-decoration:none;font-weight:700;font-size:14px;font-family:'Manrope',sans-serif;white-space:nowrap">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.3 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.9 21 3 13.1 3 3.6c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.3 1.1L6.6 10.8Z"></path></svg>
      8 917 769-61-19
    </a>

    <dc-import name="LeadModal" label="Оставить заявку" variant="solid" size="md" hint-size="180px,46px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const HEADER_SERVICES = [
  { slug: 'mezhevanie', title: 'Межевание земельных участков' },
  { slug: 'tehplan', title: 'Технические планы' },
  { slug: 'granicy-uchastka', title: 'Уточнение границ участка' },
  { slug: 'razdel-obedinenie', title: 'Раздел и объединение участков' },
];

class Component extends DCLogic {
  state = { menuOpen: false };

  renderVals() {
    return {
      menuOpen: this.state.menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      closeMenu: () => this.setState({ menuOpen: false }),
      services: HEADER_SERVICES,
    };
  }
}
</script>
</body>
</html>
