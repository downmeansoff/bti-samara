<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
</helmet>
<div class="hdr" role="banner">
  <a href="#main" class="skip-link">Перейти к содержимому</a>
  <div class="hdr-row">
    <a class="hdr-logo" href="./">
      <img src="assets/logo-mark.png" alt="Кадастровый инженер" />
      <div class="hdr-logo-text">
        <span>КАДАСТРОВЫЙ</span>
        <span>ИНЖЕНЕР</span>
      </div>
    </a>

    <div class="hdr-spacer"></div>

    <!-- На широком экране разделы видны сразу; подписи те же, что в подвале. -->
    <nav class="hdr-nav">
      <a href="./#services" class="hdr-nav-link">Услуги</a>
      <a href="./#pricing" class="hdr-nav-link">Цены</a>
      <a href="./#reviews" class="hdr-nav-link">Отзывы</a>
      <a href="./#about" class="hdr-nav-link">О компании</a>
      <a href="./#faq" class="hdr-nav-link">Частые вопросы</a>
      <a href="./#contacts" class="hdr-nav-link">Контакты</a>
    </nav>

    <div class="hdr-menu-wrap">
      <button type="button" class="hdr-menu-btn" onClick="{{ toggleMenu }}" aria-expanded="{{ menuOpen }}" aria-controls="hdr-menu-panel">
        Меню
      </button>

      <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
        <div class="hdr-menu-overlay" onClick="{{ closeMenu }}"></div>
        <button type="button" class="close-x" onClick="{{ closeMenu }}" aria-label="Закрыть">✕</button>
        <div class="hdr-menu-panel" id="hdr-menu-panel" role="navigation" onClick="{{ onPanelClick }}">
          <div class="hdr-menu-label">Услуги</div>
          <div class="hdr-menu-grid">
            <sc-for list="{{ services }}" as="s" hint-placeholder-count="9">
              <a href="{{ s.slug }}" class="hdr-menu-link">{{ s.title }}</a>
            </sc-for>
          </div>
          <div class="hdr-menu-divider"></div>
          <div class="hdr-menu-jumps">
            <a href="./#about" onClick="{{ closeMenu }}" class="hdr-menu-jump">О компании</a>
            <a href="./#awards" onClick="{{ closeMenu }}" class="hdr-menu-jump">Документы и награды</a>
            <a href="./#process" onClick="{{ closeMenu }}" class="hdr-menu-jump">Как работаем</a>
            <a href="./#reviews" onClick="{{ closeMenu }}" class="hdr-menu-jump">Отзывы</a>
            <a href="./#pricing" onClick="{{ closeMenu }}" class="hdr-menu-jump">Цены</a>
            <a href="./#faq" onClick="{{ closeMenu }}" class="hdr-menu-jump">Вопросы</a>
            <a href="./#contacts" onClick="{{ closeMenu }}" class="hdr-menu-jump">Контакты</a>
          </div>
          <div class="hdr-menu-divider"></div>
          <div class="hdr-menu-contacts">
            <sc-for list="{{ phones }}" as="ph" hint-placeholder-count="2">
              <a href="{{ ph.tel }}" class="hdr-chip" aria-label="{{ ph.ariaLabel }}">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.3 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.9 21 3 13.1 3 3.6c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.3 1.1L6.6 10.8Z"></path></svg>
                {{ ph.display }}
              </a>
            </sc-for>
            <a href="{{ telegramUrl }}" target="_blank" rel="noreferrer" class="hdr-chip">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 3 10.5l6.2 2.3M21 3l-3.4 17-6.2-4.9M21 3 9.9 13.9m0 0-.7 5.6 3.3-3.4"></path></svg>
              {{ telegramHandle }}
            </a>
            <a href="mailto:{{ email }}" class="hdr-chip">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>
              Email
            </a>
          </div>
        </div>
      </sc-if>
    </div>

    <div class="hdr-phone-group">
      <sc-for list="{{ phones }}" as="ph" hint-placeholder-count="2">
        <a class="hdr-phone" href="{{ ph.tel }}" aria-label="{{ ph.ariaLabel }}">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.3 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.9 21 3 13.1 3 3.6c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.3 1.1L6.6 10.8Z"></path></svg>
          {{ ph.display }}
        </a>
      </sc-for>
    </div>

    <div class="hdr-cta-slot">
      <dc-import name="LeadModal" label="Оставить заявку" variant="solid" size="md" hint-size="180px,46px"></dc-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const HEADER_SERVICES = [
  { slug: 'mezhevanie', title: 'Межевание земельных участков' },
  { slug: 'tehplan', title: 'Технический план объекта недвижимости' },
  { slug: 'razdel-obedinenie', title: 'Перераспределение, раздел и объединение участков' },
];

class Component extends DCLogic {
  state = { menuOpen: false };

  _wasMenuOpen = false;

  componentDidMount() {
    this._wasMenuOpen = this.state.menuOpen;
    this._onKeyDown = (e) => {
      if (e.key === 'Escape' && this.state.menuOpen) this.setState({ menuOpen: false });
    };
    window.addEventListener('keydown', this._onKeyDown);
  }

  componentWillUnmount() {
    if (this._onKeyDown) window.removeEventListener('keydown', this._onKeyDown);
  }

  componentDidUpdate(prevProps) {
    if (this._wasMenuOpen !== this.state.menuOpen) {
      this._wasMenuOpen = this.state.menuOpen;
      if (this.state.menuOpen) {
        const panel = document.getElementById('hdr-menu-panel');
        const firstLink = panel && panel.querySelector('a, button');
        if (firstLink) firstLink.focus();
      } else {
        const btn = document.querySelector('.hdr-menu-btn');
        if (btn) btn.focus();
      }
    }
  }

  renderVals() {
    const C = window.BTI_CONTACTS;
    return {
      menuOpen: this.state.menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      closeMenu: () => this.setState({ menuOpen: false }),
      // .hdr-menu-overlay sits behind .hdr-menu-panel (z-index 70 vs 71) and is
      // therefore unreachable by tap/click on every viewport — the panel is
      // position:fixed;inset:0 same as the overlay, so it always fully covers it.
      // Close on a tap that lands on the panel's own empty background instead.
      // r2 review found e.target===e.currentTarget (the LeadModal onOverlayClick
      // pattern) doesn't work here: .hdr-menu-jumps/.hdr-menu-contacts/.hdr-menu-grid
      // are nested flex containers with their own `gap`, so a tap in THEIR empty gap
      // sets e.target to that wrapper div, never to .hdr-menu-panel itself — closing
      // never fires. Check "not a real link/button" instead, which covers every
      // wrapper's background uniformly; taps on actual links/buttons keep their own
      // behaviour untouched (closeMenu / navigation).
      onPanelClick: (e) => { if (!e.target.closest('a, button')) this.setState({ menuOpen: false }); },
      services: HEADER_SERVICES,
      // Multi-var interpolation in one attribute ("{{ ph.region }}: {{ ph.display }}")
      // renders as no attribute at all (support.js limitation) — pre-compute the
      // string and use a single-var {{ ph.ariaLabel }} instead (same pattern as
      // .mob-cta-call's working "Позвонить: {{ ph.region }}" in Footer.dc.html).
      phones: C.phones.map(ph => ({ ...ph, ariaLabel: ph.region + ': ' + ph.display })),
      telegramUrl: C.telegram.url,
      telegramHandle: C.telegram.handle,
      email: C.email,
    };
  }
}
</script>
</body>
</html>
